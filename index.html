<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roots Rota</title>
<meta name="theme-color" content="#b9531a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roots Rota">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: friendly and plain, like a note on the staff-room wall.
IDEA: a pocket rota card – your next shift first, then the week.
PICTURE: a big "next shift" card with large hanging times.
COLOUR and TYPE: Roots burnt orange header, warm off-white ground, Lato + Montserrat.
LAYOUT: one phone-width column, tabs at the bottom like a native app.
*/
:root{--or:#b9531a;--or-d:#8f3f12;--or-l:#fbeee4;--bg:#f8f3ee;--ink:#1f2a37;--mut:#6b7785;--line:#ece2da;--card:#fff;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{font:16px/1.45 Lato,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.top{background:var(--or);color:#fff;padding:calc(var(--st) + 12px) 18px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.top img{height:34px;display:block}
.top .who{margin-left:auto;text-align:right;font-size:13px;line-height:1.25}
.top .who b{display:block;font-size:15px}
.top .menu{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;width:40px;height:40px;font-size:20px;margin-left:8px}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + var(--sb))}
h1{font:700 22px/1.2 Montserrat,sans-serif;margin:6px 0 14px}
h2{font:700 15px/1.2 Montserrat,sans-serif;margin:22px 0 8px;color:var(--mut);text-transform:none}
.muted{color:var(--mut);font-size:14px}
/* login */
.login{max-width:460px;margin:0 auto;padding:calc(var(--st) + 28px) 18px 40px}
.login .brand{background:var(--or);border-radius:22px;padding:26px 20px;text-align:center;margin-bottom:22px}
.login .brand img{height:56px}
.login .brand div{color:#fff;font:600 13px Montserrat,sans-serif;letter-spacing:2px;margin-top:10px}
.search{width:100%;font-size:16px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:12px}
.search:focus{outline:2px solid var(--or);border-color:transparent}
.names{display:grid;gap:8px}
.name{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;min-height:56px}
.name:active{background:var(--or-l)}
.av{width:38px;height:38px;border-radius:50%;background:var(--or-l);color:var(--or-d);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex:none}
.pin{text-align:center}
.pin h1{margin-top:4px}
.dots{display:flex;justify-content:center;gap:16px;margin:18px 0 6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--or)}
.dots i.on{background:var(--or)}
.dots.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.err{min-height:22px;color:#b42318;font-weight:700;font-size:15px;margin:6px 0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:320px;margin:8px auto 0}
.keys button{height:66px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:26px;font-weight:700}
.keys button:active{background:var(--or-l)}
.keys .sm{font-size:15px;color:var(--mut)}
.link{background:none;border:0;color:var(--or-d);font-weight:700;padding:12px;margin-top:10px}
/* next shift */
.next{background:var(--or);color:#fff;border-radius:22px;padding:20px 20px 18px;box-shadow:0 10px 24px rgba(143,63,18,.22)}
.next .lab{font:600 13px Montserrat,sans-serif;opacity:.9}
.next .day{font:700 20px/1.2 Montserrat,sans-serif;margin:6px 0 2px}
.next .time{font:900 clamp(38px,11vw,52px)/1 Lato,sans-serif;letter-spacing:-.5px;margin:6px 0 8px;white-space:nowrap}
.next .meta{font-size:15px;opacity:.95}
.next.none{background:#fff;color:var(--ink);box-shadow:none;border:1px solid var(--line)}
/* lists */
.wk{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .d{width:58px;flex:none;text-align:center;line-height:1.1}
.row .d b{display:block;font-size:22px}
.row .d span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.row .t{font-weight:900;font-size:18px;white-space:nowrap}
.row .r{font-size:14px;color:var(--mut)}
.row .h{margin-left:auto;font-size:14px;color:var(--mut);white-space:nowrap}
.row.past{opacity:.5}
.row.today{background:var(--or-l)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:2px 8px;background:var(--or);color:#fff;margin-left:6px;vertical-align:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.sum{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);padding:8px 4px 0}
/* rota */
.wnav{display:flex;align-items:center;gap:8px;margin:2px 0 14px}
.wnav button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px;flex:none}
.wnav .rng{flex:1;text-align:center;font:700 17px Montserrat,sans-serif}
.wnav .now{width:auto;padding:0 12px;font-size:14px;font-weight:700}
.dayc{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.dayc .dh{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;background:#fffaf6;border-bottom:1px solid var(--line)}
.dayc .dh b{font:700 16px Montserrat,sans-serif}
.dayc .dh span{font-size:13px;color:var(--mut)}
.dayc.today .dh{background:var(--or-l)}
.ps{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid #f4ede7}
.ps:first-of-type{border-top:0}
.ps .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.ps .n{font-weight:700}
.ps .rl{font-size:13px;color:var(--mut)}
.ps .tm{margin-left:auto;font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
.ps.me{background:#fff4ec}
.ps.me .n:after{content:" (you)";font-weight:400;color:var(--or-d)}
.empty{padding:14px;color:var(--mut);font-size:14px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:700;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--or);color:#fff}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + var(--sb));z-index:10}
.tabs button{flex:1;border:0;background:none;padding:8px 4px;border-radius:12px;font-weight:700;font-size:13px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--or)}
.note{background:#fff7e0;color:#7a5a00;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.install{background:#fff;border:1px dashed var(--or);border-radius:14px;padding:12px 14px;font-size:14px;margin:14px 0;display:flex;gap:10px;align-items:center}
.install button{margin-left:auto;background:var(--or);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700;white-space:nowrap}
.sheet{position:fixed;inset:0;background:rgba(20,28,38,.45);display:flex;align-items:flex-end;z-index:50}
.sheet>div{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + var(--sb));max-width:640px;margin:0 auto}
.sheet button{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;margin-top:10px}
.sheet .danger{color:#b42318}
.spin{width:28px;height:28px;border:3px solid var(--or-l);border-top-color:var(--or);border-radius:50%;animation:r 1s linear infinite;margin:40px auto}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin,.dots.shake{animation:none}}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<script>
{
const CFG={url:'https://vvhrtizoncwbuynbrczg.supabase.co',key:'sb_publishable_xOqrqL8x9zRexvIXeUZORg_NVw4vOMM',weekStart:5};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const app=document.getElementById('app');
const S={token:null,me:null,tab:'mine',week:null,mode:'all',people:[],pickId:null,pin:'',data:{},installEvt:null};
function store(k,v){try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function load(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pad(n){return String(n).padStart(2,'0');}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function add(s,n){const d=parse(s);d.setDate(d.getDate()+n);return fmt(d);}
function today(){return fmt(new Date());}
function weekOf(s){const d=parse(s);const diff=(d.getDay()-CFG.weekStart+7)%7;d.setDate(d.getDate()-diff);return fmt(d);}
function mins(t){const p=String(t||'0:0').split(':').map(Number);return p[0]*60+(p[1]||0);}
function hrs(x){let m=mins(x.end)-mins(x.start);if(m<=0)m+=1440;return m/60;}
function hm(h){const m=Math.round(h*60);return Math.floor(m/60)+'h'+(m%60?' '+pad(m%60)+'m':'');}
function dayTxt(s,long){const d=parse(s);return (long?DOWL:DOW)[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];}
function initials(n){return String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');}
function first(n){return String(n||'').split(/\s+/)[0];}

async function rpc(fn,args){
  const r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}

/* ---------- login ---------- */
async function showPeople(){
  S.pickId=null;S.pin='';
  app.innerHTML='<div class="login"><div class="brand"><img src="logo.png" alt="Roots"><div>STAFF ROTA</div></div><div class="spin"></div></div>';
  try{S.people=await rpc('rota_people');}catch(e){S.people=load('people')||[];}
  if(S.people.length)store('people',S.people);
  renderPeople('');
}
function renderPeople(q){
  const list=S.people.filter(p=>!q||p.name.toLowerCase().includes(q.toLowerCase()));
  const box=app.querySelector('.login');
  box.innerHTML='<div class="brand"><img src="logo.png" alt="Roots"><div>STAFF ROTA</div></div>'+
    '<h1>Who are you?</h1><input class="search" id="q" placeholder="Search your name" value="'+esc(q)+'" autocomplete="off">'+
    '<div class="names">'+(list.length?list.map(p=>'<button class="name" data-id="'+esc(p.id)+'"><span class="av">'+esc(initials(p.name))+'</span><span>'+esc(p.name)+'</span></button>').join(''):'<div class="muted">'+(S.people.length?'No match. Check the spelling.':'Can’t reach the rota right now. Check your signal and try again.')+'</div>')+'</div>'+
    installHtml();
  const qi=box.querySelector('#q');qi.addEventListener('input',()=>{const v=qi.value;renderPeople(v);const n=app.querySelector('#q');n.focus();n.setSelectionRange(v.length,v.length);});
  box.querySelectorAll('.name').forEach(b=>b.addEventListener('click',()=>{S.pickId=b.dataset.id;S.pin='';renderPin('');}));
  bindInstall();
}
function renderPin(err){
  const p=S.people.find(x=>x.id===S.pickId);if(!p)return renderPeople('');
  app.querySelector('.login').innerHTML='<div class="pin"><div class="av" style="margin:0 auto;width:64px;height:64px;font-size:22px">'+esc(initials(p.name))+'</div>'+
    '<h1>Hi '+esc(first(p.name))+'</h1><div class="muted">Enter your 4-digit PIN<br>(the same one you clock in with)</div>'+
    '<div class="dots">'+[0,1,2,3].map(i=>'<i class="'+(i<S.pin.length?'on':'')+'"></i>').join('')+'</div><div class="err">'+esc(err||'')+'</div>'+
    '<div class="keys">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button data-k="'+n+'">'+n+'</button>').join('')+'<button class="sm" data-k="back">Not me</button><button data-k="0">0</button><button class="sm" data-k="del">⌫</button></div></div>';
  app.querySelectorAll('.keys button').forEach(b=>b.addEventListener('click',()=>key(b.dataset.k)));
}
let busy=false;
async function key(k){
  if(busy)return;
  if(k==='back')return renderPeople('');
  if(k==='del'){S.pin=S.pin.slice(0,-1);return renderPin('');}
  if(S.pin.length>=4)return;
  S.pin+=k;renderPin('');
  if(S.pin.length<4)return;
  busy=true;
  try{
    const r=await rpc('rota_login',{p_staff:S.pickId,p_pin:S.pin});
    if(r.ok){S.token=r.token;S.me={id:r.id,name:r.name};store('token',r.token);store('me',S.me);S.tab='mine';S.week=weekOf(today());busy=false;return showApp();}
    S.pin='';
    const msg=r.error==='locked'?'Too many tries. Wait '+r.wait+' min, or ask a manager.':r.error==='pin'?'Wrong PIN. '+r.left+' tr'+(r.left===1?'y':'ies')+' left.':'Something went wrong. Try again.';
    renderPin(msg);const d=app.querySelector('.dots');d.classList.add('shake');
  }catch(e){S.pin='';renderPin('No connection. Try again.');}
  busy=false;
}

/* ---------- data ---------- */
async function getRange(from,to){
  const ck='r:'+from+':'+to;
  try{
    const r=await rpc('rota_get',{p_token:S.token,p_from:from,p_to:to});
    if(!r.ok){if(r.error==='session'){logout(true);return null;}throw new Error(r.error);}
    store(ck,r);S.data[ck]=r;S.offline=false;return r;
  }catch(e){const c=load(ck);S.offline=true;if(c)return c;throw e;}
}

/* ---------- main app ---------- */
function shell(inner){
  return '<header class="top"><img src="logo.png" alt="Roots"><div class="who"><b>'+esc(first(S.me.name))+'</b>'+esc(S.updated||'')+'</div><button class="menu" id="menu" aria-label="Menu">⋯</button></header>'+
    '<main>'+(S.offline?'<div class="note">You’re offline. Showing the rota as it was last loaded.</div>':'')+inner+'</main>'+
    '<nav class="tabs"><button data-tab="mine" class="'+(S.tab==='mine'?'on':'')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>My shifts</button>'+
    '<button data-tab="rota" class="'+(S.tab==='rota'?'on':'')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Full rota</button></nav>';
}
function bindShell(){
  app.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;if(S.tab==='rota')S.week=S.week||weekOf(today());showApp();window.scrollTo(0,0);}));
  app.querySelector('#menu').addEventListener('click',menu);
}
function menu(){
  const d=document.createElement('div');d.className='sheet';
  d.innerHTML='<div><b>'+esc(S.me.name)+'</b><div class="muted">'+esc(S.updated||'')+'</div><button id="rf">Refresh rota</button><button class="danger" id="lo">Log out</button><button id="cx">Close</button></div>';
  document.body.appendChild(d);
  d.addEventListener('click',e=>{if(e.target===d||e.target.id==='cx')d.remove();});
  d.querySelector('#rf').addEventListener('click',()=>{d.remove();showApp();});
  d.querySelector('#lo').addEventListener('click',()=>{d.remove();logout();});
}
function roleOf(r,id){return (r.roles||[]).find(x=>x.id===id)||{name:'',color:'#9aa6b2'};}
function updTxt(r){if(!r||!r.updated_at)return '';const d=new Date(r.updated_at);return 'Updated '+d.getDate()+' '+MON[d.getMonth()]+' '+pad(d.getHours())+':'+pad(d.getMinutes());}

async function showApp(){
  if(!app.querySelector('main'))app.innerHTML='<div class="spin"></div>';
  try{ S.tab==='rota'?await showRota():await showMine(); }
  catch(e){app.innerHTML=shell('<div class="note">Can’t load the rota right now. Check your signal and tap ⋯ → Refresh.</div>');bindShell();}
}
async function showMine(){
  const t=today(),from=weekOf(t),to=add(from,55);
  const r=await getRange(from,to);if(!r)return;S.updated=updTxt(r);
  const mine=r.shifts.filter(x=>x.staff===S.me.id&&x.type!=='leave');
  const upcoming=mine.filter(x=>x.date>t||(x.date===t&&mins(x.end)>nowMins()));
  const nx=upcoming[0];
  let h='<h1>My shifts</h1>';
  if(nx){const rl=roleOf(r,nx.role);const isT=nx.date===t,isTm=nx.date===add(t,1);
    h+='<div class="next"><div class="lab">'+(isT?'TODAY':isTm?'TOMORROW':'NEXT SHIFT')+'</div><div class="day">'+esc(dayTxt(nx.date,true))+'</div><div class="time">'+esc(nx.start)+' – '+esc(nx.end)+'</div><div class="meta">'+esc(rl.name)+(rl.name?' · ':'')+hm(hrs(nx))+'</div></div>';}
  else h+='<div class="next none"><div class="day">No shifts coming up</div><div class="muted">New shifts appear here as soon as the rota is published.</div></div>';
  h+=installHtml();
  // group by week
  const weeks={};mine.forEach(x=>{const w=weekOf(x.date);(weeks[w]=weeks[w]||[]).push(x);});
  const keys=Object.keys(weeks).sort();
  if(!keys.length)h+='<p class="muted">Nothing on the rota for you in the next 8 weeks.</p>';
  keys.forEach(w=>{const list=weeks[w];const tot=list.reduce((a,x)=>a+hrs(x),0);
    h+='<h2>'+(w===weekOf(t)?'This week':w===add(weekOf(t),7)?'Next week':'Week of '+esc(dayTxt(w)))+'</h2><div class="wk">'+
      list.map(x=>{const d=parse(x.date),rl=roleOf(r,x.role),past=x.date<t||(x.date===t&&mins(x.end)<=nowMins());
        return '<div class="row'+(past?' past':'')+(x.date===t?' today':'')+'"><div class="d"><span>'+DOW[d.getDay()]+'</span><b>'+d.getDate()+'</b></div><div><div class="t">'+esc(x.start)+' – '+esc(x.end)+(x.date===t?'<span class="tag">Today</span>':'')+'</div><div class="chip"><i style="background:'+esc(rl.color)+'"></i>'+esc(rl.name)+'</div></div><div class="h">'+hm(hrs(x))+'</div></div>';}).join('')+
      '</div><div class="sum"><span>'+list.length+' shift'+(list.length===1?'':'s')+'</span><span>'+hm(tot)+'</span></div>';});
  app.innerHTML=shell(h);bindShell();bindInstall();
}
function nowMins(){const d=new Date();return d.getHours()*60+d.getMinutes();}
async function showRota(){
  const ws=S.week,we=add(ws,6),t=today();
  const r=await getRange(ws,we);if(!r)return;S.updated=updTxt(r);
  const people={};(r.people||[]).forEach(p=>people[p.id]=p);
  let h='<h1>Full rota</h1><div class="wnav"><button id="pw" aria-label="Previous week">‹</button><div class="rng">'+esc(rangeTxt(ws))+'</div><button id="nw" aria-label="Next week">›</button>'+(ws!==weekOf(t)?'<button class="now" id="tw">Today</button>':'')+'</div>'+
    '<div class="seg"><button data-m="all" class="'+(S.mode==='all'?'on':'')+'">Everyone</button><button data-m="me" class="'+(S.mode==='me'?'on':'')+'">Just me</button></div>';
  for(let i=0;i<7;i++){const d=add(ws,i);const dd=parse(d);
    let list=r.shifts.filter(x=>x.date===d&&x.type!=='leave');if(S.mode==='me')list=list.filter(x=>x.staff===S.me.id);
    const oh=(r.hours||{})[String(dd.getDay())]||{};
    h+='<div class="dayc'+(d===t?' today':'')+'"><div class="dh"><b>'+esc(dayTxt(d,true))+(d===t?'<span class="tag">Today</span>':'')+'</b><span>'+(oh.open&&oh.close?'Open '+esc(oh.open)+'–'+esc(oh.close):'')+'</span></div>'+
      (list.length?list.map(x=>{const p=people[x.staff]||{name:'?'},rl=roleOf(r,x.role);
        return '<div class="ps'+(x.staff===S.me.id?' me':'')+'"><span class="bar" style="background:'+esc(rl.color)+'"></span><div><div class="n">'+esc(p.name)+'</div><div class="rl">'+esc(rl.name)+'</div></div><div class="tm">'+esc(x.start)+' – '+esc(x.end)+'</div></div>';}).join(''):'<div class="empty">'+(S.mode==='me'?'You’re not on':'Nobody on the rota yet')+'</div>')+'</div>';}
  app.innerHTML=shell(h);bindShell();
  app.querySelector('#pw').addEventListener('click',()=>{S.week=add(S.week,-7);showApp();});
  app.querySelector('#nw').addEventListener('click',()=>{S.week=add(S.week,7);showApp();});
  const tw=app.querySelector('#tw');if(tw)tw.addEventListener('click',()=>{S.week=weekOf(today());showApp();});
  app.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{S.mode=b.dataset.m;showApp();}));
}
function rangeTxt(ws){const a=parse(ws),b=parse(add(ws,6));return a.getDate()+(a.getMonth()!==b.getMonth()?' '+MON[a.getMonth()]:'')+' – '+b.getDate()+' '+MON[b.getMonth()];}
async function logout(expired){
  const t=S.token;S.token=null;S.me=null;store('token');store('me');
  try{Object.keys(localStorage).filter(k=>k.startsWith('r:')).forEach(k=>localStorage.removeItem(k));}catch(e){}
  if(t&&!expired)try{await rpc('rota_logout',{p_token:t});}catch(e){}
  showPeople();
}

/* ---------- add to home screen ---------- */
function standalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
function installHtml(){
  if(standalone()||load('hideInstall'))return '';
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(S.installEvt)return '<div class="install" id="inst"><span>Add Roots Rota to your home screen</span><button id="instb">Install</button></div>';
  if(ios)return '<div class="install" id="inst"><span>To install: tap <b>Share</b> <span aria-hidden="true">⬆︎</span> then <b>Add to Home Screen</b>.</span><button id="instx">OK</button></div>';
  return '<div class="install" id="inst"><span>To install: open the browser menu <b>⋮</b> and tap <b>Add to Home screen</b> or <b>Install app</b>.</span><button id="instx">OK</button></div>';
}
function bindInstall(){
  const b=app.querySelector('#instb');if(b)b.addEventListener('click',async()=>{S.installEvt.prompt();try{await S.installEvt.userChoice;}catch(e){}S.installEvt=null;const i=app.querySelector('#inst');if(i)i.remove();});
  const x=app.querySelector('#instx');if(x)x.addEventListener('click',()=>{store('hideInstall',1);const i=app.querySelector('#inst');if(i)i.remove();});
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installEvt=e;if(!app.querySelector('#inst')&&S.token&&S.tab==='mine')showApp();});

/* ---------- start ---------- */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.token)showApp();});
S.token=load('token');S.me=load('me');S.week=weekOf(today());
if(S.token&&S.me)showApp();else showPeople();
}
</script>
